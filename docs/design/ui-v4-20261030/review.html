const state={app:'sim',page:'workbench',control:'gimbal',layout:'scene',record:false,gt:true,sensor:'infrared',dense:false,accent:'#5797ff'};
const navs={sim:[['workbench','▣','工作台'],['scene','◈','场景编排'],['fleet','◇','设备管理'],['interfaces','⇄','数据接口'],['settings','⚙','资源设置']],train:[['collect','▣','采集工作台'],['samples','▤','样本检查'],['settings','⚙','连接设置']]};
const names={workbench:['仿真工作台','City Sample · 单机 / 单云台'],scene:['场景编排','屋顶角位 · 世界坐标 / 米'],fleet:['设备管理','按实例管理 · 不改变现有设备身份'],interfaces:['数据与接口','按设备公开数据 · 控制与采集分开'],settings:['资源与设置','连接 / 存储 / 性能 / 布局'],collect:['采集工作台','ptz-01 · VIS + IR · 同组图像与GT'],samples:['样本检查','规划功能 · 使用既有样本演示']};
const $=(q)=>root.querySelector(q);
const button=(t,action,cl='')=>`<button class="${cl}" data-action="${action}">${t}</button>`;
const seg=(arr,active,key)=>`<div class="segmented">${arr.map(([v,t])=>`<button class="${v===active?'active':''}" data-${key}="${v}">${t}</button>`).join('')}</div>`;
const check=(t,id,yes=true)=>`<label class="check"><input type="checkbox" data-check="${id}" ${yes?'checked':''}>${t}</label>`;
const val=(t,v,unit='')=>`<label>${t}<input value="${v}${unit}" aria-label="${t}"></label>`;
const pairField=(a,b)=>`<div class="two">${a}${b}</div>`;
function photo(kind,gt=false){const p=A[kind];return `<div class="photo" data-photo="${kind}" data-w="${p.width}" data-h="${p.height}"><img src="${p.uri}" alt="既有${kind==='ir'?'红外':kind==='vis'?'可见光':'城市观察'}仿真图像">${gt&&p.box?`<div class="gt" style="left:${100*p.box[0]/p.width}%;top:${100*p.box[1]/p.height}%;width:${100*(p.box[2]-p.box[0])/p.width}%;height:${100*(p.box[3]-p.box[1])/p.height}%"><span>uav-01 · GT</span></div>`:''}</div>`}
function viewer(code,title,kind,gt=false,cl=''){return `<section class="viewer ${cl}"><div class="viewerbar"><span class="view-code">${code}</span><span>${title}</span><div class="right"><span class="muted">${kind==='obs'?'观察':kind==='vis'?'1920×1080':'640×512'}</span>${button('⤢','enlarge-'+kind)}</div></div><div class="media">${photo(kind,gt)}${kind==='obs'?'<div class="hud">自由观察 · 不控制设备</div><div class="compass">N ↑</div>':''}</div></section>`}
function lidar(){return `<section class="viewer"><div class="viewerbar"><span class="view-code">LIDAR</span><span>点云</span><div class="right">${button('启停','power-lidar')}</div></div><div class="media"><div class="lidar"><svg viewBox="0 0 280 110" role="img" aria-label="点云示意，非实际扫描数据"><path d="M0 88L280 88M140 12L25 110M140 12L255 110M75 62L205 62M105 36L175 36" stroke="#35505a" fill="none"/>${Array.from({length:100},(_,i)=>`<circle cx="${24+(i*29%235)}" cy="${20+(i*17%77)}" r="${i%3===0?1.4:.8}" fill="#6eb7a8" opacity="${.3+(i%4)*.17}"/>`).join('')}</svg><span class="lidar-note">点云布局示意</span></div></div></section>`}
function tree(){return `<aside class="tree"><div class="section-title">场景设备</div><button class="object ${state.control==='drone'?'selected':''}" data-control="drone"><span>◇ 无人机 · 01<small>Mavic 3 / uav-01</small></span><span class="tag">待命</span></button><button class="object ${state.control==='gimbal'?'selected':''}" data-control="gimbal"><span>◉ 光电云台 · 01<small>ptz-01</small></span><span class="tag">已选</span></button><button class="object child" data-action="sensor-visible">↳ 可见光 <span class="dot"></span></button><button class="object child" data-action="sensor-infrared">↳ 红外 <span class="dot"></span></button><button class="object child" data-action="power-lidar">↳ 激光雷达 <span class="dot"></span></button><div class="section-title">快捷入口</div><button class="object" data-go="routes">↗ 航线任务</button><button class="object" data-action="environment">☼ 环境与天气</button><div class="tree-note">单击查看属性<br>明确接管后才改变控制对象</div><div class="softline" style="margin-top:20px"></div><div class="section-title">运行主机 · 示例</div><div class="kv"><span>GPU</span><strong>Arc B580</strong><span>UE 推进</span><strong>30.0 FPS</strong><span>显存</span><strong>6.2 / 12.0 GB</strong></div>${button('运行诊断','performance','quiet')}</aside>`}
function inspector(){if(state.control==='drone')return `<aside class="inspector"><div class="inspector-head"><div><h3>无人机 · 01</h3><small>uav-01 · Mavic 3</small></div><span class="pill">待命</span></div><div class="control-strip">当前键盘：观察场景<small>查看设备属性不会自动接管</small></div><div class="row">${button('起飞','takeoff','primary')}${button('悬停','hover')}${button('降落','land')}</div>${button('接管手动驾驶','take-control')}<div class="section-title">飞行任务</div><div class="row"><span>屋顶巡航</span>${button('编辑航线','routes','quiet')}</div><div class="kv"><span>任务状态</span><strong>已上传 / 未执行</strong><span>航点</span><strong>4 个</strong><span>高度</span><strong>40.8 m</strong><span>速度</span><strong>0.0 m/s</strong></div>${button('执行已上传航线','route-run')}<div class="softline"></div><h3>手动控制</h3><div class="joystick"><button aria-label="手动驾驶摇杆示意" data-action="stick">＋</button></div><div class="hint">W/S 前后 · A/D 左右<br>R/F 升降 · Q/E 转向<br>松开或失焦停止输入</div><div class="bottom-action">${button('展开遥测','telemetry','quiet')}</div></aside>`;return `<aside class="inspector"><div class="inspector-head"><div><h3>光电云台 · 01</h3><small>ptz-01</small></div><span class="pill">方向保持</span></div><div class="control-strip">当前键盘：观察场景<small>云台可查看，尚未接管</small></div><label>控制模式<select data-local="gimbal-mode"><option>方向保持</option><option>UE 真值跟踪</option><option>手动控制</option></select></label><label>跟踪目标<select><option>无人机 · 01 / uav-01</option></select></label><div class="row">${button('接管云台','take-control','primary')}${button('停止并保持','hold')}</div><div class="joystick"><button aria-label="云台摇杆示意" data-action="stick">＋</button></div><div class="kv"><span>实际偏航</span><strong>−126.1°</strong><span>实际俯仰</span><strong>11.5°</strong></div><div class="softline"></div><h3>传感器</h3><div class="row"><span>VIS 可见光</span><label class="check"><input type="checkbox" checked data-check="vis-power">已启用</label></div><div class="row"><span>IR 红外</span><label class="check"><input type="checkbox" checked data-check="ir-power">已启用</label></div><div class="row"><span>激光雷达</span><label class="check"><input type="checkbox" checked data-check="lidar-power">已启用</label></div><div class="bottom-action">${button('编辑传感器参数','sensor-infrared')}</div></aside>`}

function fitPhotos(){root.querySelectorAll('.photo').forEach(el=>{const p=el.parentElement;if(!p)return;const rect=p.getBoundingClientRect();if(rect.width===0||rect.height===0)return;const w=+el.dataset.w,h=+el.dataset.h;const scale=Math.min(rect.width/w,rect.height/h);el.style.width=w*scale+'px';el.style.height=h*scale+'px';});}

function drawer(title,content,wide=false){$('.overlay-host').innerHTML=`<section class="drawer ${wide?'drawerwide':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="row"><div><span class="view-code">${state.app==='sim'?'SIMULATION':'DATA STUDIO'}</span><h2>${title}</h2></div>${button('关闭 ×','close-drawer','quiet')}</div>${content}</section>`;requestAnimationFrame(fitPhotos);$('.drawer button')?.focus();}
function sensorDrawer(sensor){state.sensor=sensor;const ir=sensor==='infrared';drawer('传感器参数',`${seg([['visible','VIS 可见光'],['infrared','IR 红外'],['lidar','激光雷达']],sensor,'sensor')}<div class="row"><span>光电云台 · 01 / ptz-01</span>${check('启用','sensor-enabled')}</div><div class="softline"></div>${sensor==='lidar'?`${pairField(val('距离上限','120',' m'),val('扫描频率','10',' Hz'))}${val('水平视场','120',' °')}`:`<div class="statline"><span>原始输出<b>${ir?'640×512':'1920×1080'}</b></span></div>${val('水平视场 FOV','25.0',' °')}${ir?`<label>极性<select><option>白热</option><option>黑热</option></select></label>${pairField(val('对比度','1.10'),val('亮度偏置','0.00'))}<label>增益策略<select><option>稳定自动增益</option><option>锁定增益</option><option>手动范围</option></select></label>`:`${pairField(val('曝光补偿','0.0',' EV'),val('Gamma','1.03'))}`}<details><summary>安装与双相机几何</summary><div class="form" style="margin-top:12px">${pairField(val('镜头X偏置','0.0',' cm'),val('镜头Y偏置',ir?'12.0':'0.0',' cm'))}${pairField(val('俯仰偏差',ir?'0.1':'0.0',' °'),val('偏航偏差',ir?'0.2':'0.0',' °'))}</div></details>`}<span class="hint">字段为设计示例；最终仅显示当前后端能力支持的字段。草稿不会自动提交。</span><div class="banner amber">2 项未应用更改 · 示例</div><div class="spacer"></div><div class="row">${button('恢复已应用值','restore-values')}${button('应用到此传感器','apply-sensor','primary')}</div>`)}
function connection(){if(state.app==='train')return drawer('训练数据连接',`<div class="form">${val('仿真数据主机','127.0.0.1')}${pairField(val('GT数据端口','50100'),val('云台实例','ptz-01'))}<div class="banner">数据 / GT策略通道，不开放飞控权限</div><span class="hint">更换主机、端口或设备后清空旧组并重新订阅；连接成功不表示保存已启动。</span><div class="actions">${button('测试数据连接','test-connection')}${button('应用连接设置','connect-save','primary')}</div></div>`);drawer('连接与数据通道',`<div class="form">${val('主机地址','127.0.0.1')}${pairField(val('UE控制','50051'),val('飞控','50052'))}${pairField(val('GT数据','50100'),val('RTSP','8554'))}<div class="banner"><span>参数草稿 · 当前连接保持原值</span></div><div class="hint">连接 ≠ 已采集 ≠ 已保存。实施时分别显示通道状态、会话身份和错误原因。</div><div class="actions">${button('测试连接','test-connection')}${button('应用连接设置','connect-save','primary')}</div></div>`)}
root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||!root.contains(b))return;
 if(b.dataset.app){state.app=b.dataset.app;state.page=state.app==='sim'?'workbench':'collect';$('.overlay-host').innerHTML='';render();return persist()}
 if(b.dataset.go){state.page=b.dataset.go;render();return persist()}
 if(b.dataset.layout){state.layout=b.dataset.layout;render();return persist()}
 if(b.dataset.control){state.control=b.dataset.control;render();return persist()}
 if(b.dataset.sensor){sensorDrawer(b.dataset.sensor);return}
 if(b.dataset.sample){root.querySelectorAll('[data-sample]').forEach(el=>el.classList.toggle('active',el===b));toast('已选择示意样本 sample_'+(128+Number(b.dataset.sample)));return}
 const a=b.dataset.action;if(!a)return;
 if(a==='close-drawer'){$('.overlay-host').innerHTML='';return}
 if(a==='other-app'){state.app=state.app==='sim'?'train':'sim';state.page=state.app==='sim'?'workbench':'collect';render();return persist()}
 if(a==='connection')return connection();
 if(a.startsWith('sensor-'))return sensorDrawer(a.replace('sensor-',''));
 if(a.startsWith('go-')){state.page=a.slice(3);render();return persist()}
 if(a==='back'){state.page=state.app==='sim'?'workbench':'collect';render();return}
 if(a==='routes'){state.page='routes';render();return}
 if(a==='record'){state.record=!state.record;render();toast(state.record?'设计演示：保存任务已开始，预览继续运行':'设计演示：仅停止保存，保持预览连接');return}
 if(a==='collection-settings')return drawer('采集设置',`<div class="form">${pairField(val('预览上限','5.0',' FPS'),val('保存上限','1.0',' 组/s'))}${check('保留部分遮挡','occlusion')}${check('保留部分出画','outside')}${val('输出目录','F:\\Datasets\\WISEYE\\roof-city')}<span class="hint">连接中改动从后续新样本生效；在途旧版本样本不会混入。</span><div class="bottom-action">${button('保存采集设置','apply-collection','primary')}</div></div>`);
 if(a==='environment')return drawer('环境与天气',`<div class="env-preview"><img src="${A.obs.uri}" alt="城市环境示例"><div><h3>City Sample</h3><p class="hint">只影响本次运行环境<br>不改变设备初始布置</p></div></div><label>时间 <span class="mono" data-hour>12:00</span><input data-range="hour" type="range" min="0" max="23" value="12"></label>${pairField(val('云量','0.20'),val('雾强度','0.05'))}${val('雨强度','0.00')}<span class="hint">显示能力随实际后端启用；视觉天气不是热辐射或气象物理模型。</span><div class="spacer"></div><div class="row">${button('恢复场景默认','restore-env')}${button('应用环境','apply-env','primary')}</div>`);
 if(a==='performance')return drawer('运行诊断',`<div class="banner">以下数值均为布局示例</div><div class="kv"><span>运行主机GPU</span><strong>Intel Arc B580</strong><span>显存占用</span><strong>6.2 / 12.0 GB</strong><span>UE推进</span><strong>30.0 FPS</strong><span>普通传感器新帧</span><strong>约10 Hz</strong><span>训练同步GT</span><strong>约4.5组/s</strong><span>保存</span><strong>1.0组/s</strong></div><div class="banner amber">GPU持续高负载 → 建议切换均衡或关闭不使用的采集源</div><span class="hint">未知指标显示“不可用”，不填0。预览端关闭画面与设备停止采集分开。</span>`);
 if(a==='fusion')return drawer('融合对照',`${seg([['raw','原始叠加'],['rotation','视轴对齐']],'raw','fusion-mode')}<div class="media" style="min-height:260px;flex:none">${photo('ir',state.gt)}</div><div class="banner amber">图像占位：此稿不计算融合，不作为配准效果证据。</div><label>红外占比 <span data-alpha>50%</span><input type="range" data-range="alpha" value="50" min="0" max="100"></label><div class="kv"><span>相机基线</span><strong>12 cm · 示例</strong><span>采集时差</span><strong>0.000 ms · 示例</strong><span>GT中心偏差</span><strong>Δx +37.3 / Δy −2.8 px</strong></div><span class="hint">只补偿旋转，不补偿基线深度视差。GT中心差不等于配准精度。融合默认不占用采集主画面。</span>`,true);
 if(a.startsWith('enlarge-')||a==='pair-inspect'){const kind=a==='pair-inspect'?'ir':a.slice(8);return drawer(kind==='ir'?'红外 · 独立查看':kind==='vis'?'可见光 · 独立查看':'场景 · 独立查看',`<div class="media" style="min-height:420px">${photo(kind,state.app==='train'&&state.gt)}</div><span class="hint">布局预览；正式窗口复用已有帧源，不新建采集线程。</span>`,true)}
 if(a==='events')return drawer('事件与日志',`<div class="kv"><span>13:38:10</span><strong>UE与飞控就绪 · 示例</strong><span>13:38:11</span><strong>ptz-01 · VIS/IR采集启用</strong><span>13:39:00</span><strong>布局已保存</strong></div><span class="hint">错误按设备与请求归属显示。可复制详情，不把完整日志常驻在画面下方。</span>`);
 if(a==='add-device'||a==='edit-device')return drawer(a==='add-device'?'新增设备':'编辑设备',`<div class="form">${val('显示名称','无人机 · 02')}<label>类型<select><option>无人机</option><option>光电云台</option></select></label><label>型号<select><option>Mavic 3</option><option>Avata</option></select></label><span class="hint">新设备生成独立ID。添加后按现有规则保存并加载场景；不伪装为无需重载。</span><div class="bottom-action">${button('确认设备草稿','device-confirm','primary')}</div></div>`);
 const messages={'take-control':'设计演示：明确接管后才获得键盘输入；实际程序需设备确认','hold':'设计演示：停止输入并保持方向','apply-sensor':'设计演示：等待当前设备 / 当前请求确认，成功后才更新已应用值','save-layout':'设计演示：保存初始布置，不重载当前场景','place-confirm':'设计演示：确认位置并应用到当前场景','route-upload':'设计演示：航线已上传，尚未执行','route-run':'设计演示：执行需先起飞并确认就绪','takeoff':'设计演示：起飞会单独确认并回读实际状态','land':'设计演示：降落完成后回读ready与真实旋翼状态','copy':'设计演示：复制当前实际配置的接口地址','integrity':'规划功能：核对图像、标签、JSON和双路身份，不修改原文件','native':'设计演示：1:1像素查看不改变源分辨率','fit':'设计演示：恢复适应窗口','apply-env':'设计演示：等待环境参数确认','connect-save':'设计演示：重新连接后核对新会话身份','test-connection':'设计演示：将分别测试UE、飞控、GT数据通道'};
 toast(messages[a]||'设计演示：'+b.textContent.trim()+' · 尚未连接实际程序');
});
root.addEventListener('change',event=>{const c=event.target.dataset.check;if(c==='gt'){state.gt=event.target.checked;render();persist()}else if(c&&c.includes('power'))toast('设计演示：设备采集启停需后端确认；画面显示开关独立');});
root.addEventListener('input',event=>{if(event.target.dataset.range==='hour')root.querySelector('[data-hour]').textContent=event.target.value.padStart(2,'0')+':00';if(event.target.dataset.range==='alpha')root.querySelector('[data-alpha]').textContent=event.target.value+'%';});
root.addEventListener('keydown',event=>{if(event.key==='Escape')$('.overlay-host').innerHTML=''});
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{proposal:'WISEYE UI V4',application:state.app,page:state.page,layout:state.layout,gt:state.gt},privateContent:null}).catch(()=>{});}
const saved=window.openai?.widgetState?.modelContent;if(saved?.proposal==='WISEYE UI V4'){if(['sim','train'].includes(saved.application))state.app=saved.application;if(names[saved.page])state.page=saved.page;if(['scene','sensors'].includes(saved.layout))state.layout=saved.layout;}
window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.modelContent;if(s?.proposal==='WISEYE UI V4'&&['sim','train'].includes(s.application)){state.app=s.application;state.page=s.page|| (state.app==='sim'?'workbench':'collect');state.layout=s.layout||'scene';render()}});
new ResizeObserver(()=>requestAnimationFrame(fitPhotos)).observe(root);
render();
if(globalThis.Tweak){const tweak=new Tweak({container:$('.app'),onChange:render});tweak.addColorPicker(state,'accent',{label:'蓝色强调',reference:'--w-blue'});tweak.addSelect(state,'control',{label:'右侧控制对象',options:[{label:'光电云台',value:'gimbal'},{label:'无人机',value:'drone'}]});}
window.WISEYE_DESIGN={state,render,drawer,photo,fitPhotos};
})();
</script>
</body></html>
